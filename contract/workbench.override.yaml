### The contract stack's changes to workbench's test stack: the last file of contract/compose.yaml's `include`, merged
### over docker/compose.yaml and docker/compose.test.yaml as `-f` files are (Compose's documented way to change an
### included model; redefining an included resource in the including file is an error).
###
### A data volume and a network named for the contract project, so neither a developer's (workbench-data,
### workbench-net) nor the isolation stack's (workbench-test-*) is ever used; no host port for the api, so the
### isolation stack keeps 18100; and the caller key make test-contract makes for each run.

services:
  api:
    # Reached only through Open WebUI.
    ports: !reset []
    environment:
      OPEN_WEBUI_WORKBENCH_KEY: ${WORKBENCH_CONTRACT_KEY:?make test-contract sets it}

volumes:
  workbench-data:
    name: workbench-contract-data

networks:
  workbench-net:
    name: workbench-contract-net
