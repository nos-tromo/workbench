name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned to an immutable commit SHA (v3.22): strict-config + make/common.mk +
    # bundle-lib + audit-library drift-checks; nos-tromo style tuning:
    # line-length=120, ANN401 ignored, local pyrefly hook. Canonical configs at
    # nos-tromo/.github/configs/{python-strict,make-common,bundle,audit}/.
    # docker-build builds both images and scans them. A job that calls a
    # reusable workflow takes no timeout-minutes (GitHub refuses the key
    # there), so this one has GitHub's default; the two below have their own.
    uses: nos-tromo/.github/.github/workflows/python-app-ci.yml@2715bedabe594a449e411182393e68da59c791f3 # v3.22
    with:
      python-versions: '["3.12"]'
      uv-sync-args: '--locked --group dev --extra executor'
      docker-build: true

  executor-root:
    # The executor's tests as root in its own image, in the production shape
    # (root-only /dev/shm and /tmp, no POSIX queues) and with Docker's default
    # /dev/shm, where the defence-in-depth IPC cleanup is exercised.
    runs-on: ubuntu-latest
    needs: ci
    # Measured 4.5 minutes on an 8-CPU host with the image's layers cached
    # (two runs of about 2 minutes each); a runner's cold build adds more.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Root executor tests, both shapes
        run: make test-executor-root

  isolation:
    # The executor's isolation on the running test stack
    # (docker/compose.test.yaml): a project, volume and network of its own.
    runs-on: ubuntu-latest
    needs: ci
    # Measured 1 minute on an 8-CPU host with both images cached (the
    # tests 48 s); a runner builds both images cold first.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.11'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Pin Python
        run: uv python pin 3.12
      - name: Isolation tests
        # Docker refuses a CPU limit above the runner's CPUs; the default is 4.
        run: |
          if [ "$(nproc)" -lt 4 ]; then export WORKBENCH_EXECUTOR_CPUS="$(nproc)"; fi
          make test-isolation
